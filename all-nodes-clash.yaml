# 全部节点 · Clash Verge / mihomo 配置
# 导入：Clash Verge → 配置 → 新建 → 本地文件 → 选择本文件 → 设为活动配置
# 含 eurobase-Paris（实测出口法国巴黎 Scaleway，约 11 Mbps）、mshost-India（实测出口印度印多尔 Reliance Jio，约 5.7 Mbps；免费期至 2026-12-20；XHTTP 在该平台不通，只有 WS）、alwaysdata-Paris（实测出口法国巴黎 alwaysdata，约 14.5 Mbps；WS 与 XHTTP 均通，现两个协议都放订阅）与 deployvera-Istanbul（实测出口土耳其伊斯坦布尔，约 13.5 Mbps；WS 与 XHTTP 均通，现两个协议都放订阅）
# PROXY 组为 select：手动选节点（2026-11-20 用户要求，不再自动测速）；默认选中第一个 eurobase-Paris
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 8.8.8.8

proxies:
  - name: eurobase-Paris
    type: vless
    server: xray-eurobase.eurobase.dev
    port: 443
    uuid: d622f674-1f90-4667-ada2-1a6b644aea2b
    udp: true
    tls: true
    servername: xray-eurobase.eurobase.dev
    network: ws
    ws-opts:
      path: /ws-17d4331c
      headers:
        Host: xray-eurobase.eurobase.dev
  - name: mshost-India
    type: vless
    server: app-6aff01e7.deploy.meerasolution.com
    port: 443
    uuid: ec431706-40b5-432d-a63d-17e462113243
    udp: true
    tls: true
    servername: app-6aff01e7.deploy.meerasolution.com
    network: ws
    ws-opts:
      path: /ws-dfdfee87
      headers:
        Host: app-6aff01e7.deploy.meerasolution.com
  - name: alwaysdata-Paris
    type: vless
    server: mingo003.alwaysdata.net
    port: 443
    uuid: cd8b6d7f-9c1a-47d8-9c27-71192d0fc42f
    udp: true
    tls: true
    servername: mingo003.alwaysdata.net
    network: ws
    ws-opts:
      path: /ws-08cc8bd9
      headers:
        Host: mingo003.alwaysdata.net
  - name: alwaysdata-Paris-XHTTP
    type: vless
    server: mingo003.alwaysdata.net
    port: 443
    uuid: cd8b6d7f-9c1a-47d8-9c27-71192d0fc42f
    udp: true
    tls: true
    servername: mingo003.alwaysdata.net
    network: xhttp
    xhttp-opts:
      path: /ws-08cc8bd9
      mode: stream-one
      headers:
        Host: mingo003.alwaysdata.net
  - name: deployvera-Istanbul
    type: vless
    server: xray-deployvera-7fb82f.apps.deployvera.com
    port: 443
    uuid: 0a9752f2-0599-47ca-b77a-951b0f0d5b7a
    udp: true
    tls: true
    servername: xray-deployvera-7fb82f.apps.deployvera.com
    network: ws
    ws-opts:
      path: /ws-5c8314b6
      headers:
        Host: xray-deployvera-7fb82f.apps.deployvera.com
  - name: deployvera-Istanbul-XHTTP
    type: vless
    server: xray-deployvera-7fb82f.apps.deployvera.com
    port: 443
    uuid: 0a9752f2-0599-47ca-b77a-951b0f0d5b7a
    udp: true
    tls: true
    servername: xray-deployvera-7fb82f.apps.deployvera.com
    network: xhttp
    xhttp-opts:
      path: /ws-5c8314b6
      mode: stream-one
      headers:
        Host: xray-deployvera-7fb82f.apps.deployvera.com

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - eurobase-Paris
      - mshost-India
      - alwaysdata-Paris
      - alwaysdata-Paris-XHTTP
      - deployvera-Istanbul
      - deployvera-Istanbul-XHTTP

rules:
  - MATCH,PROXY
