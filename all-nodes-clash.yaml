# 全部节点 · Clash Verge / mihomo 配置
# 导入：Clash Verge → 配置 → 新建 → 本地文件 → 选择本文件 → 设为活动配置
# 含 eurobase-Paris（实测出口法国巴黎 Scaleway，约 11 Mbps）、mshost-India（实测出口印度印多尔 Reliance Jio，约 5.7 Mbps；免费期至 2026-12-20；XHTTP 在该平台不通，只有 WS）、alwaysdata-Paris（实测出口法国巴黎 alwaysdata，约 14.5 Mbps；WS 与 XHTTP 均通，现两个协议都放订阅）、cloady-France（实测出口法国劳特堡 Contabo，2026-11-23 测速约 0.1 Mbps 很慢，疑为 Cloady 欧盟网络故障，待复测；只有 WS）与 nodaroo-Sweden（瑞典斯德哥尔摩，VLESS+WS 明文 http、无 TLS，端口 25723；2026-11-24 新加，待用户真机实测）
# PROXY 组为 select：手动选节点（2026-11-20 用户要求，不再自动测速）；默认选中第一个 eurobase-Paris
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 8.8.8.8

proxies:
  - name: eurobase-Paris
    type: vless
    server: xray-eurobase.eurobase.dev
    port: 443
    uuid: d622f674-1f90-4667-ada2-1a6b644aea2b
    udp: true
    tls: true
    servername: xray-eurobase.eurobase.dev
    network: ws
    ws-opts:
      path: /ws-17d4331c
      headers:
        Host: xray-eurobase.eurobase.dev
  - name: mshost-India
    type: vless
    server: app-6aff01e7.deploy.meerasolution.com
    port: 443
    uuid: ec431706-40b5-432d-a63d-17e462113243
    udp: true
    tls: true
    servername: app-6aff01e7.deploy.meerasolution.com
    network: ws
    ws-opts:
      path: /ws-dfdfee87
      headers:
        Host: app-6aff01e7.deploy.meerasolution.com
  - name: alwaysdata-Paris
    type: vless
    server: mingo003.alwaysdata.net
    port: 443
    uuid: cd8b6d7f-9c1a-47d8-9c27-71192d0fc42f
    udp: true
    tls: true
    servername: mingo003.alwaysdata.net
    network: ws
    ws-opts:
      path: /ws-08cc8bd9
      headers:
        Host: mingo003.alwaysdata.net
  - name: alwaysdata-Paris-XHTTP
    type: vless
    server: mingo003.alwaysdata.net
    port: 443
    uuid: cd8b6d7f-9c1a-47d8-9c27-71192d0fc42f
    udp: true
    tls: true
    servername: mingo003.alwaysdata.net
    network: xhttp
    xhttp-opts:
      path: /ws-08cc8bd9
      mode: stream-one
      headers:
        Host: mingo003.alwaysdata.net
  - name: cloady-France
    type: vless
    server: edge-ws-eu-vytcwlqv-mrmingo003-png.cloady.io
    port: 443
    uuid: 5a7ff594-41fc-417a-8f5b-90903a50650c
    udp: true
    tls: true
    servername: edge-ws-eu-vytcwlqv-mrmingo003-png.cloady.io
    network: ws
    ws-opts:
      path: /ws-ade834b5
      headers:
        Host: edge-ws-eu-vytcwlqv-mrmingo003-png.cloady.io
  - name: nodaroo-Sweden
    type: vless
    server: se1.nodaroo.fun
    port: 25723
    uuid: e9418187-e72c-46af-8dcd-56d0c036d3aa
    udp: true
    tls: false
    network: ws
    ws-opts:
      path: /ws-197c31a1
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - eurobase-Paris
      - mshost-India
      - alwaysdata-Paris
      - alwaysdata-Paris-XHTTP
      - cloady-France
      - nodaroo-Sweden

rules:
  - MATCH,PROXY
