# 全部节点 · Clash Verge / mihomo 配置
# 导入：Clash Verge → 配置 → 新建 → 本地文件 → 选择本文件 → 设为活动配置
# 含 eurobase-Paris（实测出口法国巴黎 Scaleway，约 11 Mbps）、mshost-India（实测出口印度印多尔 Reliance Jio，约 5.7 Mbps；免费期至 2026-12-20）与 alwaysdata-Paris（实测出口法国巴黎 alwaysdata，约 14.5 Mbps；WS 与 XHTTP 均通，订阅里只放 WS）
# PROXY 组为 url-test：每 300 秒测一次 generate_204，自动选最快的节点；想手动指定可在 Clash Verge 里把 PROXY 组切成 select
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 8.8.8.8

proxies:
  - name: eurobase-Paris
    type: vless
    server: xray-eurobase.eurobase.dev
    port: 443
    uuid: d622f674-1f90-4667-ada2-1a6b644aea2b
    udp: true
    tls: true
    servername: xray-eurobase.eurobase.dev
    network: ws
    ws-opts:
      path: /ws-17d4331c
      headers:
        Host: xray-eurobase.eurobase.dev
  - name: mshost-India
    type: vless
    server: app-6aff01e7.deploy.meerasolution.com
    port: 443
    uuid: ec431706-40b5-432d-a63d-17e462113243
    udp: true
    tls: true
    servername: app-6aff01e7.deploy.meerasolution.com
    network: ws
    ws-opts:
      path: /ws-dfdfee87
      headers:
        Host: app-6aff01e7.deploy.meerasolution.com
  - name: alwaysdata-Paris
    type: vless
    server: mingo003.alwaysdata.net
    port: 443
    uuid: cd8b6d7f-9c1a-47d8-9c27-71192d0fc42f
    udp: true
    tls: true
    servername: mingo003.alwaysdata.net
    network: ws
    ws-opts:
      path: /ws-08cc8bd9
      headers:
        Host: mingo003.alwaysdata.net

proxy-groups:
  - name: PROXY
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - eurobase-Paris
      - mshost-India
      - alwaysdata-Paris

rules:
  - MATCH,PROXY
