# 全部节点 · Clash Verge / mihomo 配置
# 导入：Clash Verge → 配置 → 新建 → 本地文件 → 选择本文件 → 设为活动配置
# 含 hanamii-Tokyo（日本）+ easyhost-Dallas（美国），在 PROXY 组里切换
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 8.8.8.8

proxies:
  - name: hanamii-Tokyo
    type: vless
    server: app-13babf15-ed38-45e2-9eef-33baf57f7523.ingress.apprun.sakura.ne.jp
    port: 443
    uuid: 0593452c-b1e2-4bdc-ab98-37e9b97ba114
    udp: true
    tls: true
    servername: app-13babf15-ed38-45e2-9eef-33baf57f7523.ingress.apprun.sakura.ne.jp
    network: ws
    ws-opts:
      path: /ws-69c2d79f
      headers:
        Host: app-13babf15-ed38-45e2-9eef-33baf57f7523.ingress.apprun.sakura.ne.jp
  - name: easyhost-Dallas
    type: vless
    server: xray-node-351a22cd.easyhost.fun
    port: 443
    uuid: 482bb48d-8d38-43cf-ae50-2b9a984148e4
    udp: true
    tls: true
    servername: xray-node-351a22cd.easyhost.fun
    network: ws
    ws-opts:
      path: /ws-6989beca
      headers:
        Host: xray-node-351a22cd.easyhost.fun

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - easyhost-Dallas
      - hanamii-Tokyo
      - DIRECT

rules:
  - MATCH,PROXY
