# 全部节点 · Clash Verge / mihomo 配置
# 导入：Clash Verge → 配置 → 新建 → 本地文件 → 选择本文件 → 设为活动配置
# 含 deplexo-Frankfurt（德国法兰克福平台，实测出口法国斯特拉斯堡 OVH），在 PROXY 组里切换
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 8.8.8.8

proxies:
  - name: deplexo-Frankfurt
    type: vless
    server: xray-deplexo.de.deplexo.com
    port: 443
    uuid: 3dc58803-f96c-41b9-b1d2-fb3bb4bb0cbc
    udp: true
    tls: true
    servername: xray-deplexo.de.deplexo.com
    network: ws
    ws-opts:
      path: /ws-cd953c46
      headers:
        Host: xray-deplexo.de.deplexo.com

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - deplexo-Frankfurt
      - DIRECT

rules:
  - MATCH,PROXY
